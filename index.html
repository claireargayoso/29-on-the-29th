<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ea">
  <title>Nathan's 29th Birthday</title>
  <style>
    html, body { margin:0; padding:0; background:#f5f2ea; }
    body { min-height:100vh; display:flex; justify-content:center; align-items:flex-start; }
    button { all:unset; display:block; width:min(100vw,1080px); cursor:pointer; }
    img { display:block; width:100%; height:auto; }
    @media (min-width:1081px) { button { margin-top:0; } }
  </style>
</head>
<body>
  <button id="card" type="button" aria-label="Turn invitation">
    <img id="page" src="front.png" alt="Nathan's 29th birthday invitation">
  </button>
  <script>
    const page = document.getElementById('page');
    const card = document.getElementById('card');
    let front = true;
    let busy = false;

    const back = new Image();
    back.src = 'back.png';

    card.addEventListener('click', () => {
      if (busy) return;
      busy = true;

      const oldSrc = front ? 'front.png' : 'back.png';
      const newSrc = front ? 'back.png' : 'front.png';

      page.animate([
        { transform:'perspective(900px) rotateY(0deg)', opacity:1 },
        { transform:'perspective(900px) rotateY(90deg)', opacity:0.15 },
        { transform:'perspective(900px) rotateY(0deg)', opacity:1 }
      ], { duration:800, easing:'ease-in-out' });

      setTimeout(() => {
        page.src = newSrc;
        page.alt = front ? "Nathan's 29th birthday invitation — details" : "Nathan's 29th birthday invitation";
        front = !front;
      }, 400);

      setTimeout(() => { busy = false; }, 800);
    });
  </script>
</body>
</html>
